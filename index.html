<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সরস - কৃষকের ফ্রেশ পণ্য</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f9f4;
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .logo-section img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #2e7d32;
        }
        h1 {
            color: #2e7d32;
            margin-bottom: 5px;
            font-size: 32px;
        }
        .tagline {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .product-title {
            font-size: 20px;
            font-weight: bold;
            color: #1b5e20;
            margin-top: 10px;
        }
        .whatsapp-section {
            margin-top: 35px;
        }
        .whatsapp-btn {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: background 0.3s ease;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }
        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Brand Logo -->
        <div class="logo-section">
            <img src="logo.jpeg" alt="সরস লোগো">
            <h1>সরস</h1>
            <div class="tagline">কৃষকের ফ্রেশ পণ্য</div>
        </div>

        <!-- Products List -->
        <div class="products-grid">
            <!-- ব্রাউন সুগার -->
            <div class="product-card">
                <img src="01.jpg" alt="ব্রাউন সুগার">
                <div class="product-title">ব্রাউন সুগার</div>
            </div>

            <!-- খাঁটি গরুর দুধ -->
            <div class="product-card">
                <img src="004.jpg" alt="খাঁটি গরুর দুধ">
                <div class="product-title">খাঁটি গরুর দুধ</div>
            </div>

            <!-- দেশি মুরগির ডিম -->
            <div class="product-card">
                <img src="02.png" alt="দেশি মুরগির ডিম">
                <div class="product-title">দেশি মুরগির ডিম</div>
            </div>

            <!-- দেশি মুরগি -->
            <div class="product-card">
                <img src="03.jpeg" alt="দেশি মুরগি">
                <div class="product-title">দেশি মুরগি</div>
            </div>
        </div>

        <!-- WhatsApp Contact Button -->
        <div class="whatsapp-section">
            <a href="https://wa.me/8801336530525" class="whatsapp-btn" target="_blank">💬 WhatsApp-এ অর্ডার করুন</a>
        </div>

        <div class="footer">
            <p>সরাসরি খামার থেকে সংগৃহীত শতভাগ খাঁটি ও নিরাপদ পণ্য।</p>
        </div>
    </div>

</body>
</html>
